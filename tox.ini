[tox]
requires =
    tox>=4.2
envlist =
    py315-dj{61, 60, 52, main}
    py314-dj{61, 60, 52, main}
    py313-dj{61, 60, 52, main}
    py312-dj{61, 60, 52, main}
    py311-dj{52}

[testenv]
set_env =
    PYTHONDEVMODE = 1
runner = uv-venv-runner
commands =
    python \
      -W error::ResourceWarning \
      -W error::DeprecationWarning \
      -W error::PendingDeprecationWarning \
      -m pytest {posargs:tests}
deps =
    dj52: django>=5.2,<6
    dj60: django>=6.0,<6.1
    dj61: django>=6.1,<6.2
    djmain: git+https://github.com/django/django@main
dependency_groups =
    test
